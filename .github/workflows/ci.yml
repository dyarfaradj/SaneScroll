name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build (Release, Universal)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SaneScroll.xcodeproj \
            -scheme SaneScroll \
            -configuration Release \
            -destination "generic/platform=macOS" \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO | xcpretty

      - name: Verify universal binary
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "SaneScroll.app" -path "*/Release/*" | head -1)
          echo "App found at: $APP"
          file "$APP/Contents/MacOS/SaneScroll"
          lipo -info "$APP/Contents/MacOS/SaneScroll"
